# CI of this repository: the action itself on Linux, where it gives its
# directory, and on the runners it rejects, then workflow-check over all jobs.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  action:
    name: Action
    strategy:
      fail-fast: false
      matrix:
        # macOS on Intel, because arm64 runners often wait for capacity until
        # the job times out.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lib
        continue-on-error: true
        uses: $/
      - env:
          OUTCOME: ${{ steps.lib.outcome }}
          LIB_PATH: ${{ steps.lib.outputs.path }}
        shell: bash
        run: bash tests/ci/action.sh

  check:
    needs: [action]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@0a6da024486758d1f58cccd277e3a18021f3fb0c # v0.1.2
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      # No flake yet: the checks of the atoms run locally (README, Bootstrap).
      flake: ""
      renovate-presets: '["flakeyard/renovate-config"]'
