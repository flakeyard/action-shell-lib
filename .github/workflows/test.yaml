# CI of this repository: unit tests of the modules with the bash of the
# runner, the action itself on the supported runners, where it gives its
# directory, then workflow-check over all jobs.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/run.sh

  action:
    name: Action
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lib
        uses: $/
      - env:
          LIB_PATH: ${{ steps.lib.outputs.path }}
        run: tests/ci/action.sh

  check:
    needs: [unit, action]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@aa514199d5eb5231dfc42e70a99288fd79832311 # v0.4.0
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["workflows"]'
      renovate-presets: '["flakeyard/renovate-config"]'
